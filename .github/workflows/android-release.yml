name: Android Kotlin Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Kotlin Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "HAN2-MOBILE-${GITHUB_REF_NAME#v}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: HAN2 Mobile ${{ github.ref_name }}
          generate_release_notes: true
          files: HAN2-MOBILE-*.apk
