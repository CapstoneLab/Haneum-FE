name: Android Build, Test, and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 1. Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_KEYBACK_API_KEY: ${{ secrets.KEYBACK_API_KEY }}
      ORG_GRADLE_PROJECT_KEYBACK_BASE_URL: ${{ vars.KEYBACK_BASE_URL || 'http://112.186.136.153:8000/api/v1' }}
      ORG_GRADLE_PROJECT_HAN2_UPDATE_MANIFEST_URL: ${{ vars.HAN2_UPDATE_MANIFEST_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate release tag and app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' android/app/build.gradle)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          test -n "$APP_VERSION"
          test "$APP_VERSION" = "$TAG_VERSION"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' android/app/build.gradle)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            FILE_VERSION="$APP_VERSION"
          else
            FILE_VERSION="$APP_VERSION-ci.${GITHUB_RUN_NUMBER}"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "HAN2-MOBILE-${FILE_VERSION}.apk"

      - name: Upload APK for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: HAN2-MOBILE-*.apk
          if-no-files-found: error
          retention-days: 30

  test:
    name: 2. Run unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Collect test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-${{ github.run_number }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: 3. Publish GitHub Release
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Set release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=HAN2 Mobile $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=${GITHUB_SHA::7}
            echo "tag=ci-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "name=HAN2 Mobile CI #${GITHUB_RUN_NUMBER} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: HAN2-MOBILE-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
